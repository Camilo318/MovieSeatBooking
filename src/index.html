<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <title>Movie Seat Booking</title>
</head>
<body>
    <section class="format-strip" aria-labelledby="format-strip-title">
        <div class="format-strip__inner">
            <p class="format-strip__eyebrow" id="format-strip-title">Available Formats</p>
            <div class="format-strip__viewport">
                <div id="format-selector" class="format-selector" role="list" aria-label="Movie format selector"></div>
            </div>
        </div>
    </section>

    <main class="cinema-layout">
        <aside class="booking-panel" aria-label="Booking controls">
            <div class="booking-panel__block">
                <label class="booking-panel__label" for="movie">Now showing</label>
                <select name="movie" id="movie"></select>
            </div>

            <div class="booking-panel__block">
                <p class="booking-panel__label">Seat legend</p>
                <ul class="showcase">
                    <li>
                        <div class="seat"></div>
                        <small>Available</small>
                    </li>
                    <li>
                        <div class="seat selected"></div>
                        <small>Selected</small>
                    </li>
                    <li>
                        <div class="seat occupied"></div>
                        <small>Occupied</small>
                    </li>
                </ul>
            </div>

            <div class="booking-panel__block booking-panel__summary">
                <p class="booking-panel__label">Your order</p>
                <div class="summary-row summary-row--format">
                    <span class="summary-row__name" id="active-format">Digital</span>
                    <span class="summary-row__ticket" id="ticket-price">$14 / ticket</span>
                </div>
                <div class="summary-row">
                    <span class="summary-row__name">Seats</span>
                    <span class="summary-row__value" id="count">0</span>
                </div>
                <div class="summary-row">
                    <span class="summary-row__name">Total</span>
                    <span class="summary-row__value summary-row__value--price" id="price">$0</span>
                </div>
            </div>

            <div class="confirm">
                <button class="erase-btn btn">Erase</button>
                <button class="confirm-btn btn">Buy Now</button>
            </div>
        </aside>

        <section class="container auditorium" aria-label="Auditorium">
            <div class="auditorium__stage">
                <div class="screen-frame">
                    <div class="screen" id="auditorium-screen">
                        <img class="screen__media" alt="" hidden>
                    </div>

                    <button type="button" class="screen-nav screen-nav--prev" id="screen-prev" aria-label="Previous still" hidden>
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                    <button type="button" class="screen-nav screen-nav--next" id="screen-next" aria-label="Next still" hidden>
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                </div>
                <p class="auditorium__screen-label">Screen</p>
            </div>

            <div class="seat-map" id="seat-map"></div>
        </section>
    </main>

    <script type="module" src="./main.ts"></script>
</body>
</html>
